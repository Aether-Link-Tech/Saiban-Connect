name: saibaan_connect
description: SAIBAAN Development Organization employee attendance and field management.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.0.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  geolocator: ^12.0.0
  local_auth: ^2.3.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  image_picker: ^1.1.2
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
