name: saibaan_connect
description: SAIBAAN Development Organization employee attendance and field management.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State
  flutter_riverpod: ^2.5.1

  # Device capabilities
  local_auth: ^2.3.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
